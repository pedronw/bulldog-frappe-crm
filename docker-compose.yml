x-frappe-image: &frappe_image
  image: ghcr.io/frappe/crm:v1.60.0
  pull_policy: always
  restart: unless-stopped

x-frappe-volumes: &frappe_volumes
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

services:
  db:
    image: mariadb:10.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no EasyPanel}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no EasyPanel}
      MARIADB_AUTO_UPGRADE: "1"
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:8.6-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:8.6-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

  configurator:
    <<: [*frappe_image, *frappe_volumes]
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache "redis://redis-cache:6379";
        bench set-config -g redis_queue "redis://redis-queue:6379";
        bench set-config -g redis_socketio "redis://redis-queue:6379";
        bench set-config -gp socketio_port 9000;
        bench set-config -g chromium_path /usr/bin/chromium-headless-shell;
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  create-site:
    <<: [*frappe_image, *frappe_volumes]
    restart: "no"
    environment:
      SITE_NAME: ${SITE_NAME:?Defina SITE_NAME no EasyPanel}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no EasyPanel}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no EasyPanel}
    entrypoint:
      - bash
      - -c
    command:
      - |
        set -e
        wait-for-it -t 180 db:3306
        wait-for-it -t 180 redis-cache:6379
        wait-for-it -t 180 redis-queue:6379
        if [ -f "sites/$$SITE_NAME/site_config.json" ]; then
          echo "O site $$SITE_NAME ja existe. Criacao ignorada."
        else
          bench new-site \
            --mariadb-user-host-login-scope='%' \
            --admin-password="$$ADMIN_PASSWORD" \
            --db-root-username=root \
            --db-root-password="$$DB_PASSWORD" \
            --install-app crm \
            --set-default \
            "$$SITE_NAME"
          bench --site "$$SITE_NAME" set-config host_name "https://$$SITE_NAME"
          bench --site "$$SITE_NAME" migrate
        fi
    depends_on:
      configurator:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  backend:
    <<: [*frappe_image, *frappe_volumes]
    environment:
      GUNICORN_WORKERS: "2"
      GUNICORN_THREADS: "4"
      GUNICORN_TIMEOUT: "120"
    depends_on:
      create-site:
        condition: service_completed_successfully

  websocket:
    <<: [*frappe_image, *frappe_volumes]
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    depends_on:
      create-site:
        condition: service_completed_successfully

  queue-short:
    <<: [*frappe_image, *frappe_volumes]
    command:
      - bench
      - worker
      - --queue
      - short,default
    depends_on:
      create-site:
        condition: service_completed_successfully

  queue-long:
    <<: [*frappe_image, *frappe_volumes]
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    depends_on:
      create-site:
        condition: service_completed_successfully

  scheduler:
    <<: [*frappe_image, *frappe_volumes]
    command:
      - bench
      - schedule
    depends_on:
      create-site:
        condition: service_completed_successfully

  frontend:
    <<: [*frappe_image, *frappe_volumes]
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:?Defina SITE_NAME no EasyPanel}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    depends_on:
      backend:
        condition: service_started
      websocket:
        condition: service_started

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:
